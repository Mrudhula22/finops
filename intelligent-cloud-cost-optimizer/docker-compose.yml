version: '3.9'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: cloudoptimizer_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cloudoptimizer
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: cloudoptimizer_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudoptimizer_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB=cloudoptimizer
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudoptimizer_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
